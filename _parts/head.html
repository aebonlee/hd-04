<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생성형 AI 업무자동화 전문가과정 — 저장소 총정리</title>
<meta name="description" content="현대건설 생성형 AI 업무자동화 전문가과정에서 사용된 실습 저장소(hd-01~08)와 수강생 프로젝트(hd-project01~15 · 17) 안내 페이지">
<style>
  :root {
    --page:#f7f8f7; --surface:#fdfdfc; --ink:#101210; --ink2:#4c514c; --muted:#878d87;
    --border:rgba(16,18,16,.10); --grid:#e3e5e2;
    --hd:#0a7d3b; --hd-dark:#075c2b; --hd-soft:#e7f3ec;
    --blue:#2a78d6; --blue-soft:#e8f0fb;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { background:var(--page); color:var(--ink);
         font-family:"Pretendard","Malgun Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
         line-height:1.6; font-size:15px; }
  a { color:inherit; }
  .wrap { max-width:1120px; margin:0 auto; padding:0 24px; }

  /* Hero */
  /* ── 상단 메뉴 ─────────────────────────────────────────────────────── */
  .topnav { background:#0d2946; border-bottom:1px solid rgba(255,255,255,.12); position:sticky; top:0; z-index:40; }
  /* 로고는 왼쪽, 메뉴는 오른쪽. 둘을 같은 줄 가운데선에 맞춘다.
     space-between 이 둘을 양 끝으로 밀고, align-items:center 가 세로선을 맞춘다. */
  .topnav-inner {
    display:flex; align-items:center; justify-content:space-between;
    gap:24px; padding:0 24px; min-height:56px;
  }
  .topnav-brand {
    color:#fff; font-weight:750; font-size:14.5px; text-decoration:none;
    white-space:nowrap; letter-spacing:-.01em;
    flex:0 0 auto;   /* 로고는 줄어들지 않는다 */
  }
  .topnav-brand:hover { color:#cfe0ee; }
  .topnav-links {
    display:flex; align-items:center; gap:2px;
    list-style:none; margin:0; padding:0;
    overflow-x:auto; scrollbar-width:none;
    /* 화면이 좁아지면 메뉴만 줄어들고 로고는 그대로 둔다 */
    min-width:0;
  }
  .topnav-links::-webkit-scrollbar { display:none; }
  .topnav-links a {
    display:flex; align-items:center; min-height:56px;
    padding:0 12px; color:rgba(255,255,255,.78); text-decoration:none;
    font-size:13.5px; font-weight:600; white-space:nowrap;
    border-bottom:2px solid transparent; transition:color .15s, border-color .15s;
  }
  .topnav-links a:hover { color:#fff; }
  /* 지금 보고 있는 메뉴 — 색만으로 표시하지 않고 아래 선까지 준다 */
  .topnav-links a.active { color:#fff; border-bottom-color:#7ec8a0; }
  @media (max-width:860px) {
    .topnav-inner { gap:12px; padding:0 16px; min-height:52px; }
    .topnav-brand { font-size:13.5px; }
    .topnav-links a { min-height:52px; padding:0 9px; font-size:13px; }
  }
  /* 아주 좁으면 로고를 줄이고 메뉴에 자리를 준다 */
  @media (max-width:560px) {
    .topnav-brand { font-size:0; }
    .topnav-brand::before { content:"HD"; font-size:14px; }
  }
  h2[id] { scroll-margin-top: 68px; }

  header.hero { background:linear-gradient(160deg,#0b3d22 0%,#0a7d3b 70%,#149a4e 100%); color:#fff; }
  header.hero .wrap { padding:64px 24px 56px; }
  .hero .eyebrow { font-size:13px; font-weight:700; letter-spacing:.12em; opacity:.85; text-transform:uppercase; }
  .hero h1 { font-size:clamp(26px,4.5vw,40px); line-height:1.25; margin:10px 0 14px; font-weight:800; }
  .hero p.lede { max-width:720px; font-size:16px; opacity:.92; margin:0 0 26px; }
  .hero .stats { display:flex; gap:14px; flex-wrap:wrap; }
  .hero .stat { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22);
                border-radius:12px; padding:12px 20px; min-width:130px; }
  .hero .stat b { display:block; font-size:24px; font-weight:800; }
  .hero .stat span { font-size:12px; opacity:.85; }

  main { padding:44px 0 30px; }
  section { margin-bottom:52px; }
  /* 마지막 섹션은 아래 여백을 main 의 padding 이 이미 준다 — 겹치면 82px 이 된다 */
  main > .wrap > section:last-child { margin-bottom:0; }
  h2 { font-size:21px; margin:0 0 6px; font-weight:800; }
  .sec-sub { color:var(--ink2); margin:0 0 22px; font-size:14px; }
  h2 .chip { display:inline-block; font-size:11px; font-weight:700; vertical-align:3px;
             border-radius:99px; padding:2px 10px; margin-left:10px; }
  .chip.green { background:var(--hd-soft); color:var(--hd-dark); }
  .chip.blue { background:var(--blue-soft); color:#1c5cab; }

  /* 일정 */
  .timeline { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; }
  .tcard { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px 20px; }
  .tcard .day { font-size:12px; font-weight:800; color:var(--hd-dark); letter-spacing:.06em; }
  .tcard h3 { font-size:15px; margin:6px 0 8px; }
  .tcard p { margin:0; color:var(--ink2); font-size:13px; }

  /* 카드 그리드 */
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px; }
  /* 3열 고정은 아래 hd-theme.css 뒤의 override 블록에서 잡는다 */
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px;
          padding:20px 22px; display:flex; flex-direction:column; gap:8px;
          transition:box-shadow .15s ease, transform .15s ease; }
  .card:hover { box-shadow:0 6px 20px rgba(16,18,16,.08); transform:translateY(-2px); }
  .card .no { font-size:12px; font-weight:800; color:var(--muted); letter-spacing:.08em; }
  .card .no .owner { color:var(--hd-dark); }
  .card h3 { font-size:16px; margin:0; font-weight:750; }
  .card p.desc { margin:0; color:var(--ink2); font-size:13.5px; flex:1; }
  .tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:2px; }
  .tag { font-size:11px; font-weight:600; color:var(--ink2); background:#f0f1ef;
         border-radius:6px; padding:2px 8px; }
  .links { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .btn { font-size:12.5px; font-weight:700; text-decoration:none; border-radius:8px;
         padding:7px 13px; border:1px solid var(--border); background:#fff; color:var(--ink); }
  .btn:hover { border-color:#b9bdb9; }
  .btn.primary { background:var(--hd); border-color:var(--hd); color:#fff; }
  .btn.primary:hover { background:var(--hd-dark); }
  .btn.blue { background:var(--blue); border-color:var(--blue); color:#fff; }
  .btn.blue:hover { background:#1c5cab; }
  .card.this { border:1.5px solid var(--hd); background:var(--hd-soft); }

  .note { background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--hd);
          border-radius:10px; padding:14px 18px; color:var(--ink2); font-size:13.5px; margin-top:20px; }

  footer { border-top:1px solid var(--grid); padding:26px 0 40px; color:var(--muted); font-size:13px; }
  footer .wrap { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
</style>
<!-- 공통 디자인 시스템. 인라인 <style> 뒤에 와야 이긴다 (순서=우선순위) -->
<link rel="stylesheet" href="css/hd-theme.css">
<style>
  /* ⚠ 반드시 hd-theme.css 뒤에 온다. 앞에 두면 테마의 auto-fit 이 이겨
     화면 폭에 따라 열 수가 제멋대로 바뀐다. */

  /* ── 상단 메뉴 글자색 ────────────────────────────────────────────────
     ⚠ 이 규칙은 **반드시 hd-theme.css 뒤에** 있어야 한다.
     메뉴의 <a> 에는 클래스가 없어서 테마의 `a:not([class])` 규칙에 걸린다.
     그쪽이 강조색(#14385f)을 주는데, 메뉴 배경이 같은 계열 남색이라
     대비 1.24 가 되어 글자가 배경에 묻혔다. 앞에 두면 다시 묻힌다. */
  /* ── 로고와 메뉴를 같은 가운데선에 ──────────────────────────────────
     ⚠ 이 규칙도 **반드시 hd-theme.css 뒤에** 있어야 한다.
     메뉴가 <ul><li> 로 짜여 있어서 테마의 본문 목록 규칙에 그대로 걸렸다.
       .hd.hd-app ul { margin:0 0 14px; padding-left:22px }
       .hd.hd-app li { margin-bottom:8px }
     `.topnav-links { margin:0 }` 는 특정도가 (0,1,0) 이라 (0,2,0) 인 테마에
     진다. 그래서 ul 아래에 14px 여백이 붙어 메뉴 줄이 통째로 위로 밀렸고,
     li 의 8px 이 더해져 **링크 글자가 로고보다 12px 높이 떠 있었다.**
     막는 방법은 특정도를 올리는 것뿐이다 — 클래스를 하나 더 얹는다. */
  /* 로고도 링크와 똑같은 높이의 상자로 세운다.
     글자 크기가 서로 달라(로고 14.5 / 링크 13.5) 줄 상자만으로는 가운데선이
     미세하게 어긋나고, 560px 이하에서는 로고가 font-size:0 + ::before 로
     바뀌면서 6px 까지 벌어졌다. 두 쪽 모두 같은 높이의 flex 상자로 만들면
     가운데선이 계산으로 맞는다. */
  .hd.hd-app .topnav-brand { display: flex; align-items: center; min-height: 56px; }
  .hd.hd-app .topnav-links { margin: 0; padding: 0; list-style: none; }
  .hd.hd-app .topnav-links li { margin: 0; padding: 0; }
  .hd.hd-app .topnav-links li::marker { content: none; }
  /* 링크 자체가 줄 높이를 만든다 — 로고는 inner 의 align-items:center 가 맞춘다 */
  .hd.hd-app .topnav-links a { display: flex; align-items: center; min-height: 56px; }
  @media (max-width: 860px) {
    .hd.hd-app .topnav-links a,
    .hd.hd-app .topnav-brand { min-height: 52px; }
  }

  .hd.hd-app .topnav-links a,
  .hd.hd-app .topnav-links a:visited { color: rgba(255, 255, 255, .82); }   /* 대비 10.3 */
  .hd.hd-app .topnav-links a:hover   { color: #ffffff; }
  .hd.hd-app .topnav-links a.active  { color: #ffffff; border-bottom-color: #7ec8a0; }
  .hd.hd-app .topnav-brand,
  .hd.hd-app .topnav-brand:visited   { color: #ffffff; }
  .hd.hd-app .topnav-brand:hover     { color: #cfe0ee; }

  .hd.hd-app .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  @media (max-width: 1100px) { .hd.hd-app .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 720px)  { .hd.hd-app .cards { grid-template-columns: 1fr; } }

  /* 카드 안 리듬 — 제목·설명·태그·버튼이 같은 간격으로 서게 */
  .hd.hd-app .cards .card { display: flex; flex-direction: column; gap: 10px; padding: 20px 22px 18px; }
  .hd.hd-app .cards .card h3 { font-size: 17px; line-height: 1.35; margin: 0; }
  .hd.hd-app .cards .card .no { font-size: 11.5px; letter-spacing: .04em; color: var(--hd-ink-3); font-weight: 600; }

  /* ── 두 섹션을 색으로 가른다 ─────────────────────────────────────────
     실습 저장소(hd-01~08)와 수강생 프로젝트(hd-project01~15 · 17)는 성격이 다르다.
     섹션에 붙은 chip 색으로 어느 섹션인지 가려낸다(:has). */

  /* 실습 저장소 — 초록. 면을 아주 옅게 깔아 프로젝트 카드와 층을 만든다. */
  .hd.hd-app section:has(.chip.green) .cards .card {
    background: #f5faf7;
    border-color: #cfe3d6;
    border-top: 3px solid #0a6b34;
  }
  .hd.hd-app section:has(.chip.green) .cards .card .no { color: #0a6b34; font-weight: 700; }
  .hd.hd-app section:has(.chip.green) .links .btn.blue,
  .hd.hd-app section:has(.chip.green) .links .btn.primary {
    background: #0a6b34; border-color: #0a6b34;
  }
  .hd.hd-app section:has(.chip.green) .links .btn.blue:hover,
  .hd.hd-app section:has(.chip.green) .links .btn.primary:hover {
    background: #08542a; border-color: #08542a;
  }
  .hd.hd-app section:has(.chip.green) .links .btn:not(.blue):not(.primary):hover {
    border-color: #0a6b34; color: #0a6b34; background: #eaf4ee;
  }
  /* 지금 보고 있는 이 페이지(hd-04) 카드는 한 번 더 구분한다 */
  /* 지금 보고 있는 페이지(hd-04) 카드 — 나머지와 확실히 갈라 놓는다.
     테두리만 다르면 스쳐 지나가므로 면·그림자·라벨까지 함께 준다. */
  .hd.hd-app .cards .card.this {
    background: linear-gradient(180deg, #ddefe4, #f2faf5);
    border: 2px solid #0a6b34;
    border-top-width: 4px;
    box-shadow: 0 6px 20px -6px rgba(10, 107, 52, .35);
  }
  .hd.hd-app .cards .card.this .no {
    color: #08542a;
    font-weight: 750;
  }
  /* '이 페이지'라는 사실을 글자로도 붙인다 — 색만으로는 색약인 사람에게 안 보인다 */
  .hd.hd-app .cards .card.this .no::after {
    content: "현재 보는 중";
    display: inline-block;
    margin-left: 8px;
    padding: 1px 8px;
    border-radius: 999px;
    background: #0a6b34;
    color: #fff;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0;
    vertical-align: 1px;
  }
  .hd.hd-app .cards .card.this h3 { color: #08542a; }

  /* 수강생 프로젝트 — 파랑. 흰 면을 그대로 두어 실습 섹션과 갈린다. */
  .hd.hd-app section:has(.chip.blue) .cards .card {
    background: var(--hd-surface);
    border-color: #cfdcee;
    border-top: 3px solid #1c5cab;
  }
  .hd.hd-app section:has(.chip.blue) .cards .card .no { color: var(--hd-ink-3); }
  /* 수강생 성명은 코드와 같은 줄에 붙으므로 색만으로는 약하다.
     굵기까지 달리해 색을 못 보는 사람도 이름이 어디인지 알 수 있게 한다. */
  /* 수강생 이름 — 사람 이름이라 파랑으로 둔다.
     섹션 강조색(#1c5cab)보다 진한 남색을 써서 같은 파랑이어도 이름이 앞으로 나온다.
     흰 바탕 10.6:1, 섹션색과도 1.6 배 밝기 차이가 나 서로 뭉개지지 않는다. */
  .hd.hd-app .cards .card .owner { color: #153e75; font-weight: 750; letter-spacing: 0; }
  .hd.hd-app section:has(.chip.blue) .links .btn.blue,
  .hd.hd-app section:has(.chip.blue) .links .btn.primary {
    background: #1c5cab; border-color: #1c5cab;
  }
  .hd.hd-app section:has(.chip.blue) .links .btn.blue:hover,
  .hd.hd-app section:has(.chip.blue) .links .btn.primary:hover {
    background: #164a8a; border-color: #164a8a;
  }
  .hd.hd-app section:has(.chip.blue) .links .btn:not(.blue):not(.primary):hover {
    border-color: #1c5cab; color: #1c5cab; background: #eef4fb;
  }
  /* 카드 위 강조선과 짝이 되게 태그도 섹션 색을 옅게 받는다 */
  .hd.hd-app section:has(.chip.green) .tag { background: #e7f1ea; color: #0a5b2c; }
  .hd.hd-app section:has(.chip.blue)  .tag { background: #edf3fa; color: #1a4e90; }
  .hd.hd-app .cards .card .desc { font-size: 13.5px; line-height: 1.72; color: var(--hd-ink-2); margin: 0; }
  .hd.hd-app .cards .card .desc + .desc { margin-top: -2px; }
  /* 설명 안 소제목 — 무엇을 하는 도구인지 한 줄로 먼저 보이게 */
  .hd.hd-app .cards .card .lead { font-size: 13.5px; line-height: 1.7; color: var(--hd-ink); font-weight: 600; margin: 0; }
  .hd.hd-app .cards .card .points { margin: 2px 0 0; padding-left: 0; list-style: none; display: grid; gap: 5px; }
  .hd.hd-app .cards .card .points li {
    font-size: 12.8px; line-height: 1.6; color: var(--hd-ink-2);
    padding-left: 15px; position: relative;
  }
  .hd.hd-app .cards .card .points li::before {
    content: ""; position: absolute; left: 3px; top: .62em;
    width: 4px; height: 4px; border-radius: 50%; background: var(--accent); opacity: .7;
  }
  .hd.hd-app .cards .card .tags { margin-top: auto; padding-top: 4px; display: flex; flex-wrap: wrap; gap: 5px; }
  .hd.hd-app .cards .card .links { display: flex; gap: 8px; padding-top: 4px; }
  .hd.hd-app .cards .card .links .btn { flex: 1 1 auto; justify-content: center; }

  /* 두 버튼의 역할이 다르므로 무게를 다르게 준다.
     데모 열기 = 이 페이지에서 하려는 일(주). 저장소 = 곁들이는 길(부).
     둘 다 같은 외곽선 버튼이면 어느 쪽을 눌러야 하는지 알 수 없다. */
  .hd.hd-app .cards .card .links .btn.blue,
  .hd.hd-app .cards .card .links .btn.primary,
  .hd.hd-app .links .btn.blue,
  .hd.hd-app .links .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 650;
  }
  .hd.hd-app .cards .card .links .btn.blue:hover,
  .hd.hd-app .cards .card .links .btn.primary:hover,
  .hd.hd-app .links .btn.blue:hover,
  .hd.hd-app .links .btn.primary:hover {
    background: var(--accent-deep);
    border-color: var(--accent-deep);
    color: #fff;
  }
  .hd.hd-app .cards .card .links .btn:not(.blue):not(.primary),
  .hd.hd-app .links .btn:not(.blue):not(.primary) {
    background: transparent;
    border-color: var(--hd-line);
    color: var(--hd-ink-2);
    flex: 0 1 auto;          /* 부는 주보다 좁게 */
    padding-left: 14px; padding-right: 14px;
  }
  .hd.hd-app .cards .card .links .btn:not(.blue):not(.primary):hover,
  .hd.hd-app .links .btn:not(.blue):not(.primary):hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }
</style>
